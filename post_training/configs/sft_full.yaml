# Full SFT run on one H200: 3 passes over the 374 train reference solutions.
dtype: bfloat16
seed: 0
lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: all-linear}
sft:
  output_dir: runs/sft
  num_train_epochs: 3
  learning_rate: 1.0e-4
  lr_scheduler_type: constant
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  max_length: 1024
  completion_only_loss: true
  bf16: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 20
  save_total_limit: 3
  report_to: none
  seed: 0
  data_seed: 0
