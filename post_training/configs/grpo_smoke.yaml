# Smoke test: same per-step shape as the planned full run (8 prompts x 8
# generations = 64 completions per optimizer step), but only a few steps, so
# measured seconds/step can be used to decide where the full run should go.
model: Qwen/Qwen2.5-Coder-0.5B-Instruct
dtype: float32
seed: 0
max_train_problems: null   # all 374 train problems (only the first few steps are used)
sandbox: {timeout: 5.0, workers: 4}
lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: all-linear}
grpo:
  output_dir: runs/grpo_smoke
  max_steps: 5
  learning_rate: 5.0e-6
  lr_scheduler_type: constant
  per_device_train_batch_size: 2      # completions per micro-batch (8 OOMed on 16 GB MPS)
  gradient_accumulation_steps: 32     # 64 completions = 8 prompts per optimizer step
  num_generations: 8
  max_completion_length: 512
  temperature: 0.7
  top_p: 1.0
  top_k: 0
  beta: 0.04
  loss_type: grpo
  scale_rewards: group
  logging_steps: 1
  save_strategy: "no"
  report_to: none
  seed: 0
  data_seed: 0
  gradient_checkpointing: true
